<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Hostel Connect</title>

    <link rel="stylesheet" href="profile.css">
    <script src="https://kit.fontawesome.com/8eaba6d24e.js" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<script async src="https://www.googletagmanager.com/gtag/js?id=G-JGVX7X67TK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-JGVX7X67TK');
</script>
</head>

<body>

             <!-- header -->

    <header class="profile-topbar">

        <div>
            <div class="profile-subtitle">Hostel Connect</div>
            <h1>My Profile</h1>
        </div>

        <button class="settings-btn" id="settingsBtn">
            <svg viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.5 1.5-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20h-2v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.5-1.5.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6v-2h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.5-1.5.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V6h2v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.5 1.5-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2h-.2a1.7 1.7 0 0 0-1.6 1z"/>

            </svg>
        </button>

    </header>

    <div id="overlay" class="overlay hidden">
    <div class="modal">
        <button id="cancelBtn">Cancel</button>

        <input id="title" type="text">

        <button id="saveBtn">Save</button>
    </div>
</div>

<!-- SETTINGS OVERLAY -->

<div class="settings-overlay" id="settingsOverlay">

    <div class="settings-modal">

        <div class="settings-header">

            <h2>Settings</h2>

            <button class="close-settings" id="closeSettings">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>

                </svg>

            </button>

        </div>


        <div class="settings-section" id="account">

            <h3>Account</h3>

            <button class="settings-item" id="settingsEditProfile">

                <div class="settings-icon">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>

                    </svg>

                </div>

                <div class="settings-text">
                    <strong>Account Information</strong>
                    <span>View Your Account Info</span>
                </div>

                <svg class="settings-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="9 18 15 12 9 6"/>

                </svg>

            </button>


            <button class="settings-item" id="locationSettings">

                <div class="settings-icon">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>
                        <circle cx="12" cy="10" r="3"/>

                    </svg>

                </div>

                <div class="settings-text" id="locationSettings">
                    <strong>Location Settings</strong>
                    <span>Manage your preferred location</span>
                </div>

                <svg class="settings-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="9 18 15 12 9 6"/>

                </svg>

            </button>

        </div>


        <div class="settings-section" id="activity">

            <h3>Activity</h3>

            <button class="settings-item" id="myActivity">

                <div class="settings-icon">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <polyline points="3 12 7 12 10 4 14 20 17 12 21 12"/>

                    </svg>

                </div>

                <div class="settings-text">
                    <strong>My Activity</strong>
                    <span>View your activity on Hostel Connect</span>
                </div>

                <svg class="settings-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="9 18 15 12 9 6"/>

                </svg>

            </button>

        </div>


        <div class="settings-section" >

            <h3>Community</h3>

            <button class="settings-item" >

                <div class="settings-icon">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

                    </svg>

                </div>

                <div class="settings-text" id="feedback">
                    <strong>Feedback</strong>
                    <span>Tell us what you think</span>
                </div>

                <svg class="settings-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="9 18 15 12 9 6"/>

                </svg>

            </button>


            <button class="settings-item" id="communityGuidelines">

                <div class="settings-icon">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>

                    </svg>

                </div>

                <div class="settings-text">
                    <strong>Community Guidelines</strong>
                    <span>Learn how Hostel Connect works</span>
                </div>

                <svg class="settings-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="9 18 15 12 9 6"/>

                </svg>

            </button>


            <button class="settings-item" id="inviteFriends">

                <div class="settings-icon">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>

                    </svg>

                </div>

                <div class="settings-text" id="inviteFriends">
                    <strong>Invite Friends</strong>
                    <span>Invite students to Hostel Connect</span>
                </div>

                <svg class="settings-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <polyline points="9 18 15 12 9 6"/>

                </svg>

            </button>

        </div>


        <button class="settings-logout" id="logout">

            <svg viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M10 17l5-5-5-5"/>
                <path d="M15 12H3"/>
                <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>

            </svg>

            <span>Log Out</span>

        </button>

    </div>

</div>
                   <!-- profile card -->

    <main class="profile-content">

        <section class="profile-card">

            <div class="profile-avatar">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>

                </svg>

            </div>

            <div class="profile-name" id="profile-name">
                loading..
            </div>

            <div class="profile-school">
                KWASU Student
            </div>

            <button class="edit-profile" id="editProfile">
                Edit Profile
            </button>

        </section>


              <!-- stats -->

        <section class="profile-stats">

            <div class="stat">
                <strong id="numberofposts">-</strong>
                <span>Posts</span>
            </div>

            <div class="stat">
                <strong id="numberofsaved">-</strong>
                <span>Saved</span>
            </div>

        </section>


            <!-- personal info -->

        <section class="profile-section">

            <div class="section-head">
                <h2 class="section-title">Personal Information</h2>
            </div>


            <div class="profile-details">

                <div class="detail">

                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <polyline points="3 7 12 13 21 7"/>

                        </svg>
                    </div>

                    <div>
                        <span>Email</span>
                        <strong id="profile-email">
                            --@gmail.com
                        </strong>
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <path d="M22 16.9v3a2 2 0 0 1-2.2 2
                            19.8 19.8 0 0 1-8.6-3.1
                            19.5 19.5 0 0 1-6-6
                            A19.8 19.8 0 0 1 2.1 4.2
                            2 2 0 0 1 4.1 2h3
                            a2 2 0 0 1 2 1.7
                            c.1 1 .4 2 .7 2.9
                            a2 2 0 0 1-.5 2.1L8 10
                            a16 16 0 0 0 6 6l1.3-1.3
                            a2 2 0 0 1 2.1-.5
                            c.9.3 1.9.6 2.9.7
                            A2 2 0 0 1 22 16.9z"/>

                        </svg>
                    </div>

                    <div>
                        <span>Phone</span>
                        <strong id="profile-phone">
                            +234 90** ****
                        </strong>
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <path d="M3 21h18"/>
                            <path d="M5 21V5l7-3 7 3v16"/>
                            <path d="M9 21v-4h6v4"/>
                            <path d="M9 8h1"/>
                            <path d="M14 8h1"/>
                            <path d="M9 12h1"/>
                            <path d="M14 12h1"/>

                        </svg>
                    </div>

                    <div>
                        <span>School</span>
                        <strong>
                            Kwara State University
                        </strong>
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-icon">
                        <svg viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>

                        </svg>
                    </div>

                    <div>
                        <span>Matric Number</span>
                        <strong id="profile-matric">
                            24/47cs/----
                        </strong>
                    </div>

                </div>

            </div>

        </section>


         <!-- Account -->

        <section class="profile-section">

            <div class="section-head">
                <h2 class="section-title">Account</h2>
            </div>

            <div class="account-list" id="mylisting">

                <button class="account-item" >

                    <div>
                        <strong >My Listings</strong>
                        <span>View your hostel listings</span>
                    </div>

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <polyline points="9 18 15 12 9 6"/>

                    </svg>

                </button>


                <button class="account-item" id="viewsaved">

                    <div>
                        <strong>Saved Listings</strong>
                        <span>View hostels you saved</span>
                    </div>

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <polyline points="9 18 15 12 9 6"/>

                    </svg>

                </button>


                <button class="account-item logout" id="logout-btn">

                    <div>
                        <strong>Log Out</strong>
                        <span>Sign out of your account</span>
                    </div>

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="2"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M10 17l5-5-5-5"/>
                        <path d="M15 12H3"/>
                        <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>

                    </svg>

                </button>

            </div>

        </section>


        <div class="bottom-spacer"></div>

    </main>


<!-- bottom nav -->

      <div class="bottom-nav-wrap">
    <div class="bottom-nav">

  <div class="nav-item" onclick="navigateTo('home')">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  <span>Home</span>
</div>

<div class="nav-item" onclick="navigateTo('saved')">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  <span>Saved</span>
</div>

<div class="nav-fab-slot" onclick="navigateTo('post')">
  <div class="nav-fab" aria-label="Post a listing">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>
</div>

<div class="nav-item" onclick="navigateTo('message')">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <span>Messages</span>
</div>


    <div class="nav-item" onclick="navigateTo('profile')">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  <span>Profile</span>
</div>
  
</div>

            </div>

        </div>

    </div>

    <div id="nofunctiontoast" class="nofunctiontoast">
    <i class="fa-solid fa-circle-info"></i>
    <span id="toastMessage"></span>
</div>

    <script src="../theme.js"></script>
    <script src="profile.js"></script>

</body>
</html>
