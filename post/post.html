<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post | Hostel Connect</title>

    <link rel="stylesheet" href="post.css">
</head>

<body>

    <span class="toast" id="toast">Post Sent</span> 

<main class="post-page">

    <div class="post-header">
        <div>
            <p class="post-subtitle">Hostel Connect</p>
            <h1>Create a Listing</h1>
        </div>
    </div>


    <form class="post-form" id="postForm">

        <!-- TITLE -->

        <div class="form-group">
            <label for="title">Listing Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Millionaire Hostel"
                required
            >
        </div>


        <!-- Description -->

        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe the room and anything a student should know..."
                required
            ></textarea>
        </div>


        <!-- Price -->

        <div class="form-group">
            <label for="price">Price per Year</label>

            <div class="input-with-prefix">
                <span>₦</span>

                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="120000"
                    min="0"
                    required
                >
            </div>
        </div>


        <!-- Location -->

        <div class="form-group">
            <label for="location">Location</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="e.g. Tarmac, westEnd"
                required
            >
        </div>


        <!-- Room Type -->

        <div class="form-group">
            <label>Room Type</label>

            <div class="room-options">

                <label class="room-option">
                    <input
                        type="radio"
                        name="roomType"
                        value="self-contain"
                        required
                    >

                    <span>Self-Contain</span>
                </label>


                <label class="room-option">
                    <input
                        type="radio"
                        name="roomType"
                        value="single-room"
                    >

                    <span>Single Room</span>
                </label>


                <label class="room-option">
                    <input
                        type="radio"
                        name="roomType"
                        value="shared"
                    >

                    <span>Shared</span>
                </label>

            </div>
        </div>


        <!-- Amenities -->

        <div class="form-group">
            <label>Amenities</label>

            <div class="amenities">

                <label class="amenity">
                    <input type="checkbox" name="amenities" value="water">
                    <span>Water</span>
                </label>

                <label class="amenity">
                    <input type="checkbox" name="amenities" value="light">
                    <span>Light</span>
                </label>

                <label class="amenity">
                    <input type="checkbox" name="amenities" value="wifi">
                    <span>WiFi</span>
                </label>

            </div>
        </div>


        <!-- Images -->

        <div class="form-group">

            <label for="images">Room Images</label>

            <label class="image-upload" for="images">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>

                </svg>

                <strong>Add photos</strong>
                <span>Upload clear pictures of the room</span>

            </label>

            <input
                type="file"
                id="images"
                name="images"
                accept="image/*"
                multiple
                hidden
            >

        </div>


        <!-- Submit -->

        <button type="submit" class="post-button" id="submit">
            Post Listing
        </button>

    </form>

</main>


<div class="bottom-spacer"></div>


<!-- Bottom nav -->

<div class="bottom-nav-wrap">

    <div class="bottom-nav">

        <!-- HOME -->

        <div class="nav-item" onclick="navigateTo('home')">

            <svg viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>

            </svg>

            <span>Home</span>

        </div>


        <!-- Saved page btn -->

        <div class="nav-item" onclick="navigateTo('saved')">

            <svg viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>

            </svg>

            <span>Saved</span>

        </div>


        <!-- Post page btn -->

        <div class="nav-fab-slot">

            <div class="nav-fab" aria-label="Post a listing">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>

                </svg>

            </div>

        </div>


        <!-- All Message -->

        <div class="nav-item" onclick="navigateTo('message')">

            <svg viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

            </svg>

            <span>Messages</span>

        </div>


        <!-- PROFILE -->

        <div class="nav-item" onclick="navigateTo('profile')">

            <svg viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>

            </svg>

            <span>Profile</span>

        </div>

    </div>

</div>


<script src="post.js"></script>

</body>
</html>
