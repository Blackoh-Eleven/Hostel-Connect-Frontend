<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | Hostel Connect</title>

    <link rel="stylesheet" href="message.css">
</head>

<body>

    <main class="message-content">

        <div class="message-icon">

            <svg viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

            </svg>

        </div>


        <h1>Messages are coming soon</h1>


        <p>
            We're working on bringing in-app messaging to Hostel Connect.
            Soon, you'll be able to chat with hostel posters directly within the app.
        </p>


        <span class="version">
            Coming in v1.1.0
        </span>


    </main>



    <!-- Bottom nav -->

    <div class="bottom-nav-wrap">

        <div class="bottom-nav">


            <div class="nav-item"
                onclick="navigateTo('home')">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>

                </svg>

                <span>Home</span>

            </div>



            <div class="nav-item"
                onclick="navigateTo('saved')">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>

                </svg>

                <span>Saved</span>

            </div>



            <!-- Center post button -->

            <div class="nav-fab-slot"
                onclick="navigateTo('post')">

                <div class="nav-fab"
                    aria-label="Post a listing">

                    <svg viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>

                    </svg>

                </div>

            </div>



            <!-- Messages -->

            <div class="nav-item active"
                onclick="navigateTo('message')">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

                </svg>

                <span>Messages</span>

            </div>



            <!-- Profile -->

            <div class="nav-item"
                onclick="navigateTo('profile')">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>

                </svg>

                <span>Profile</span>

            </div>


        </div>

    </div>



    <script src="message.js"></script>

</body>

</html>
