<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
      <script src="https://kit.fontawesome.com/8eaba6d24e.js" crossorigin="anonymous"></script>

  <title>Hostel Connect — Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

   <link rel="stylesheet" href="signup.css">
</head>

<body>

<main class="page">

  <button class="back" type="button">
     &#8592;
  </button>

  <section class="hero">

    <div class="brand">

      <div class="logo">
         &#8962;
      </div>

      <div class="brand-name">
        <span>Malete Hostel</span>
        <span>Connect</span>
      </div>

    </div>

    <img
      class="house"
      src="signup-house.png"
      alt="Hostel building"
    >

  </section>


  <section class="content">

    <h1>
      Create your account <span>&#128075;</span>
    </h1>

    <p class="subtitle">
      Join thousands of students finding affordable hostels In Kwara State University Malete.
    </p>


    <form>

      <div class="field">

        <label for="name">
          Full name
        </label>

        <div class="input">

          <span>&#128100;</span>

          <input
            id="name"
            type="text"
            placeholder="Enter your full name"
            required
          >

        </div>

      </div>


      <div class="field">

  <label for="matric">
    Matric Number
  </label>

  <div class="input">

    <span><i class="fa-regular fa-id-card"></i></span>

    <input
      id="matric"
      type="text"
      placeholder="Enter your matric number"
      autocomplete="off"
      required
    >

  </div>

</div>

      


      <div class="field">

        <label for="email">
          Email address
        </label>

        <div class="input">

          <span> &#9993;</span>

          <input
            id="email"
            type="email"
            placeholder="Enter your email address"
            required
          >

        </div>

      </div>


      <div class="field">

        <label for="phone">
          Phone number
        </label>

        <div class="input">

          <span>&#9742;</span>

          <input
            id="phone"
            type="tel"
            placeholder="Enter your phone number"
            required
          >

        </div>

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="input">

          <span>&#9817;</span>

          <input
            id="password"
            type="password"
            placeholder="Create a strong password"
            required
          >
        <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              id="password-toggle"
            >
               &#128065;
            </button>

        </div>

      </div>


      <div class="field">

        <label for="confirm">
          Confirm password
        </label>

        <div class="input">

          <span>&#9817;</span>

          <input
            id="confirm"
            type="password"
            placeholder="Confirm your password"
            required
          >
        <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              id="password-toggle"
            >
               &#128065;
            </button>

        </div>

      </div>

      <span id="errorlogs"></span>


      <label class="terms">

        <input type="checkbox">

        <span>
          I agree to the
          <a href="#">Terms of Service</a>
          and
          <a href="#">Privacy Policy</a>
        </span>

      </label>


      <button
        class="primary"
        type="submit"
        id="signup-btn"
      >
        Sign up
      </button>

    </form>


    <div class="divider">

      <span></span>

      <b>OR</b>

      <span></span>

    </div>


    <div class="social">

      <button type="button">
        <strong>G</strong>
        Sign up with Google
      </button>

      <button type="button"> 
         <strong><i class="fa-brands fa-apple"></i></strong>
        Sign up with Apple
      </button>

    </div>


    <p class="signin">

      Already have an account?

      <a href="../hostel signin/signin.html">
        Sign in
      </a>

    </p>

  </section>

</main>

<script src="index.js"></script>
</body>
</html>
